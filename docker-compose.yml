version: "3.9"
services:
  neo4j:
    image: neo4j:5.20
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      LLM_PROVIDER: watsonx
      STORE_TYPE: neo4j
    env_file:
      - .env
    depends_on:
      - neo4j
    command: uvicorn code_analyser.api:app --host 0.0.0.0 --port 8000

volumes:
  neo4j_data:
