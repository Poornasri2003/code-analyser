services:
  - type: web
    name: code-analyser
    env: python
    buildCommand: pip install -e .
    startCommand: uvicorn code_analyser.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: watsonx
      - key: STORE_TYPE
        value: neo4j
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_URL
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_MODEL_ID
        value: ibm/granite-3-8b-instruct
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
